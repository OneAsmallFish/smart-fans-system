# ha/sensors.yaml — Home Assistant MQTT 传感器自动发现配置
# 上线后设备自动通过 MQTT Discovery 在 HA 中创建以下实体

mqtt:
  sensor:
    # BME280 温度
    - name: "Fan Controller Temperature"
      unique_id: "fan_ctrl_bme280_temp"
      state_topic: "fan-controller/+/sensor/bme280"
      value_template: "{{ value_json.temperature_c }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      device:
        identifiers: ["fan_ctrl_esp32"]
        name: "Smart Fan Controller"
        model: "ESP32-S3-N16R8"
        manufacturer: "DIY"
        sw_version: "v1.0.0"

    # BME280 湿度
    - name: "Fan Controller Humidity"
      unique_id: "fan_ctrl_bme280_hum"
      state_topic: "fan-controller/+/sensor/bme280"
      value_template: "{{ value_json.humidity_pct }}"
      unit_of_measurement: "%"
      device_class: humidity
      state_class: measurement
      device:
        identifiers: ["fan_ctrl_esp32"]

    # BME280 气压
    - name: "Fan Controller Pressure"
      unique_id: "fan_ctrl_bme280_press"
      state_topic: "fan-controller/+/sensor/bme280"
      value_template: "{{ value_json.pressure_hpa }}"
      unit_of_measurement: "hPa"
      device_class: atmospheric_pressure
      state_class: measurement
      device:
        identifiers: ["fan_ctrl_esp32"]

    # DS18B20 远程探头 0
    - name: "Fan Controller DS18B20-0"
      unique_id: "fan_ctrl_ds18b20_0"
      state_topic: "fan-controller/+/sensor/ds18b20"
      value_template: "{{ value_json.sensors[0].temperature_c }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      device:
        identifiers: ["fan_ctrl_esp32"]

    # 12V 电源电压
    - name: "Fan Controller 12V Rail"
      unique_id: "fan_ctrl_voltage_12v"
      state_topic: "fan-controller/+/sensor/voltage"
      value_template: "{{ value_json.voltage_12v | round(2) }}"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      device:
        identifiers: ["fan_ctrl_esp32"]

    # 5V 电源电压
    - name: "Fan Controller 5V Rail"
      unique_id: "fan_ctrl_voltage_5v"
      state_topic: "fan-controller/+/sensor/voltage"
      value_template: "{{ value_json.voltage_5v | round(2) }}"
      unit_of_measurement: "V"
      device_class: voltage
      state_class: measurement
      device:
        identifiers: ["fan_ctrl_esp32"]

    # ESP32 内部温度
    - name: "Fan Controller MCU Temperature"
      unique_id: "fan_ctrl_internal_temp"
      state_topic: "fan-controller/+/sensor/internal_temp"
      value_template: "{{ value_json.temperature_c }}"
      unit_of_measurement: "°C"
      device_class: temperature
      state_class: measurement
      device:
        identifiers: ["fan_ctrl_esp32"]

    # 风扇 0-3 转速
    - name: "Fan 0 RPM"
      unique_id: "fan_ctrl_fan0_rpm"
      state_topic: "fan-controller/+/fan/0/state"
      value_template: "{{ value_json.rpm }}"
      unit_of_measurement: "RPM"
      state_class: measurement
      device:
        identifiers: ["fan_ctrl_esp32"]

    - name: "Fan 1 RPM"
      unique_id: "fan_ctrl_fan1_rpm"
      state_topic: "fan-controller/+/fan/1/state"
      value_template: "{{ value_json.rpm }}"
      unit_of_measurement: "RPM"
      state_class: measurement
      device:
        identifiers: ["fan_ctrl_esp32"]

    - name: "Fan 2 RPM"
      unique_id: "fan_ctrl_fan2_rpm"
      state_topic: "fan-controller/+/fan/2/state"
      value_template: "{{ value_json.rpm }}"
      unit_of_measurement: "RPM"
      state_class: measurement
      device:
        identifiers: ["fan_ctrl_esp32"]

    - name: "Fan 3 RPM"
      unique_id: "fan_ctrl_fan3_rpm"
      state_topic: "fan-controller/+/fan/3/state"
      value_template: "{{ value_json.rpm }}"
      unit_of_measurement: "RPM"
      state_class: measurement
      device:
        identifiers: ["fan_ctrl_esp32"]
